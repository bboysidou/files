[package]
name = "files"
version = "0.1.0"
edition = "2024"
description = "A fast, keyboard-friendly file manager for any Linux desktop"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui-pre = "0.3.11"
gpui-pre-platform = { version = "0.3.11", features = ["font-kit", "wayland", "x11"] }
jiff = "0.2.40"
rust-i18n = "4.2.4"
trash = "5.3.0"

[lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
