[package]
name = "files"
version = "0.1.0"
edition = "2024"
description = "A fast, keyboard-friendly file manager for any Linux desktop"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3"
gpui-pre = "0.3.11"
gpui-pre-platform = { version = "0.3.11", features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm"] }
imagesize = "0.15.0"
jiff = "0.2.40"
md-5 = "0.10.6"
notify = "8.2.1"
percent-encoding = "2.3.2"
png = "0.18.1"
rustix = { version = "1.1.6", features = ["fs", "process", "pty"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
rust-i18n = "4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
toml = "1.2.1"
trash = "5.3.0"
wl-clipboard-rs = "0.9.5"
xattr = "1.7.0"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
similar = "3.2.1"

[lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
